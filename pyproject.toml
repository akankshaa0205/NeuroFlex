[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroflex"
version = "0.1.0"
description = "Real-time touchless rehabilitation assessment engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
neuroflex = "neuroflex.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
