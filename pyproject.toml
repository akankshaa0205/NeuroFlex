[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroflex"
version = "0.1.0"
description = "Real-Time CV Rehabilitation Engine with CPU-GPU parallel processing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "torch>=2.0",
    "mediapipe>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroflex*"]
